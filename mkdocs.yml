site_name: TaxoFlow - The Tutorial
nav:
    - Home: index.md
    - Precourse preparations: precourse.md
    - Environments:
      - Environment options: envsetup/index.md
      - GitHub Codespaces: envsetup/01_setup.md
      - Local Devcontainers: envsetup/03_devcontainer.md
      - Manual installation: envsetup/02_local.md
      - CodeSandbox: envsetup/04_sandbox.md
      - HPC installation: envsetup/05_HPC.md
    - Orientation: 00_orientation.md
    - Course material:
      - Part 1 - Pipeline: course_material/01_pipeline.md
      - Part 2 - Single sample: course_material/02_single-sample.md
      - Part 3 - Multisample: course_material/03_multi-sample.md

theme:
  name: material
  logo: assets/images/taxoflow_logo.svg
  favicon: assets/images/taxoflow_logo.svg
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.code.copy
    - navigation.top
    - navigation.footer
  palette: 
    # Palette toggle for light mode
    - scheme: clear
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  version:
    provider: mike
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our trainig material and whether users
      find what they're searching for. With your consent, you're helping us to
      make our training material better.
    cookies:
      matomo: Matomo Analytics

copyright: >
  Copyright &copy; 2021-2026 University of Fribourg - BUGFri
  <a href="#__consent">Change cookie settings</a>

# Repository
repo_name: jeffe107/taxoflow_tutorial
repo_url: https://github.com/jeffe107/taxoflow_tutorial

markdown_extensions:
  - abbr
  - def_list
  - footnotes
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - sane_lists
  - smarty
  - toc
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/consent.js
